components:
  schemas:
    Body_createNutritionExtraction:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        imageKind:
          $ref: '#/components/schemas/ImageKind'
          default: AUTO
      required:
      - file
      title: Body_createNutritionExtraction
      type: object
    EmptyRequest:
      additionalProperties: false
      properties: {}
      title: EmptyRequest
      type: object
    GoalCreateRequest:
      additionalProperties: false
      properties:
        effectiveFrom:
          format: date
          title: Effectivefrom
          type: string
        effectiveTo:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Effectiveto
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        targetWeightKg:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,4}|(?=[\d.]{1,7}0*$)\d{0,4}\.\d{0,2}0*$)
            type: string
          - type: 'null'
          title: Targetweightkg
        targets:
          items:
            $ref: '#/components/schemas/GoalTargetInput'
          maxItems: 25
          minItems: 1
          title: Targets
          type: array
      required:
      - name
      - effectiveFrom
      - targets
      title: GoalCreateRequest
      type: object
    GoalTargetInput:
      additionalProperties: false
      properties:
        nutrientCode:
          maxLength: 40
          minLength: 1
          title: Nutrientcode
          type: string
        targetAmount:
          anyOf:
          - minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,13}0*$)\d{0,8}\.\d{0,4}0*$)
            type: string
          title: Targetamount
        targetKind:
          $ref: '#/components/schemas/TargetKind'
      required:
      - nutrientCode
      - targetAmount
      - targetKind
      title: GoalTargetInput
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImageKind:
      enum:
      - AUTO
      - LABEL
      - PLATE
      title: ImageKind
      type: string
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          format: password
          title: Password
          type: string
          writeOnly: true
      required:
      - email
      - password
      title: LoginRequest
      type: object
    MealNutrientInput:
      additionalProperties: false
      properties:
        amount:
          anyOf:
          - minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,15}0*$)\d{0,10}\.\d{0,4}0*$)
            type: string
          title: Amount
        code:
          maxLength: 40
          minLength: 1
          title: Code
          type: string
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,1}|(?=[\d.]{1,6}0*$)\d{0,1}\.\d{0,4}0*$)
            type: string
          - type: 'null'
          title: Confidence
        provenance:
          anyOf:
          - $ref: '#/components/schemas/NutrientProvenance'
          - type: 'null'
      required:
      - code
      - amount
      title: MealNutrientInput
      type: object
    MealSource:
      enum:
      - MANUAL
      - IMAGE
      - PDF
      - CHAT
      title: MealSource
      type: string
    MealType:
      enum:
      - BREAKFAST
      - LUNCH
      - DINNER
      - SNACKS
      title: MealType
      type: string
    MealUpsertRequest:
      additionalProperties: false
      properties:
        foodName:
          maxLength: 200
          minLength: 1
          title: Foodname
          type: string
        mealType:
          $ref: '#/components/schemas/MealType'
        notes:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Notes
        nutrients:
          items:
            $ref: '#/components/schemas/MealNutrientInput'
          maxItems: 25
          minItems: 1
          title: Nutrients
          type: array
        occurredAt:
          format: date-time
          title: Occurredat
          type: string
        quantity:
          $ref: '#/components/schemas/QuantityInput'
        source:
          $ref: '#/components/schemas/MealSource'
          default: MANUAL
        sourceExtractionId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Sourceextractionid
        timezone:
          title: Timezone
          type: string
      required:
      - mealType
      - foodName
      - quantity
      - occurredAt
      - timezone
      - nutrients
      title: MealUpsertRequest
      type: object
    NutrientCategory:
      enum:
      - ENERGY
      - MACRO
      - VITAMIN
      - MINERAL
      title: NutrientCategory
      type: string
    NutrientProvenance:
      enum:
      - USER
      - LABEL_AI
      - PLATE_AI
      - PDF_AI
      title: NutrientProvenance
      type: string
    ProfileUpdateRequest:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          minLength: 1
          title: Displayname
          type: string
        timezone:
          title: Timezone
          type: string
      required:
      - displayName
      - timezone
      title: ProfileUpdateRequest
      type: object
    QuantityInput:
      additionalProperties: false
      properties:
        description:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Description
        unit:
          maxLength: 30
          minLength: 1
          title: Unit
          type: string
        value:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,13}0*$)\d{0,8}\.\d{0,4}0*$)
            type: string
          title: Value
      required:
      - value
      - unit
      title: QuantityInput
      type: object
    SignupRequest:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          minLength: 1
          title: Displayname
          type: string
        email:
          format: email
          title: Email
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 12
          title: Password
          type: string
          writeOnly: true
        timezone:
          title: Timezone
          type: string
      required:
      - email
      - password
      - displayName
      - timezone
      title: SignupRequest
      type: object
    TargetKind:
      enum:
      - TARGET
      - MINIMUM
      - MAXIMUM
      title: TargetKind
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
