[project]
name = "personal-calorie-tracker-api"
version = "0.1.0"
description = "FastAPI backend for the Personal Calorie Tracker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "filetype>=1.2,<2",
  "google-genai>=1.30,<2",
  "pillow>=11.3,<12",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["N811"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = false
files = ["src"]
warn_unused_configs = true
exclude = ["src/persistence/migrations"]

[[tool.mypy.overrides]]
module = ["structlog"]
ignore_missing_imports = true

[tool.uv]
package = false
