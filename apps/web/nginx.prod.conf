limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=extraction:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    limit_conn per_ip 40;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/calorie-tracker-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calorie-tracker-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /api/v1/auth/login { limit_req zone=login burst=10 nodelay; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $http_x_request_id; proxy_pass http://backend:8000; }
    location = /api/v1/nutrition-extractions { client_max_body_size 10m; limit_req zone=extraction burst=5 nodelay; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $http_x_request_id; proxy_pass http://backend:8000; proxy_read_timeout 30s; }
    location ^~ /api/v1/pdf-imports { client_max_body_size 15m; limit_req zone=general burst=50 nodelay; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $http_x_request_id; proxy_pass http://backend:8000; }
    location ^~ /api/ { limit_req zone=general burst=50 nodelay; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $http_x_request_id; proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
