services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calorie_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-calorie_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

  migrate:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calorie_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calorie_tracker}
      DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_USER:-calorie_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calorie_tracker}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-calorie_tracker}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

  nginx:
    build: ./apps/web
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
